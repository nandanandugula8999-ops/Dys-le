# Netlify hosts static files only — it cannot run server.py (Flask + TensorFlow).
# Frontend now includes an offline browser demo fallback, so uploads work on
# Netlify without a backend. For full 88.67% hybrid AI, host server.py or
# server_cnn_only.py separately (Render / Railway / HF Spaces) and open the
# site with ?backend=https://your-backend (saved to localStorage).
[build]
  command = "mkdir -p public/static && cp frontend/index.html public/index.html && cp -r frontend/css frontend/js frontend/images public/static/ && cp api-missing.json public/api-missing.json"
  publish = "public"

# Return JSON (not Netlify's HTML 404 page) for missed /api/* calls so the
# frontend can reliably detect offline mode.
[[redirects]]
  from = "/api/*"
  to = "/api-missing.json"
  status = 404
  force = true
